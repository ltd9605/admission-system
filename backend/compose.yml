services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres_container
    environment:
      POSTGRES_DB: ams_database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ams_database" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
