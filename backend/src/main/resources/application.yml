server:
  port: 8080

spring:
  application:
    name: am-system

  datasource:
    url: jdbc:postgresql://localhost:5432/ams_database
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true 
    properties:
      hibernate:
        format-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
jwt: 
  secret : ${JWT_SECRET}
  accessTokenExpirationMs : 900000        # 15 m
  refreshTokenExpirationMs : 604800000    # 7 d